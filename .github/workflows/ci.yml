name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar JavaScript
        run: |
          node --check js/data.js
          node --check js/app-core.js
      - name: Verificar HTML essencial
        run: grep -q '<title>' index.html
